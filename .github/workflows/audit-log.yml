name: audit-log

on:
  push:
    paths:
      - "services/audit_log/**"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    paths:
      - "services/audit_log/**"
      - "pyproject.toml"
      - "uv.lock"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-caching: true

      - name: Install dependencies
        run: uv sync --frozen --package audit-log

      - name: Lint
        run: uv run --package audit-log ruff check services/audit_log/src

      - name: Type check
        run: uv run --package audit-log mypy services/audit_log/src

      - name: Unit tests
        run: uv run --package audit-log pytest services/audit_log/tests/unit -v

      - name: Contract tests
        run: uv run --package audit-log pytest services/audit_log/tests/contract -v

      - name: Pact tests
        run: uv run --package audit-log pytest services/audit_log/tests/pact -v

      - name: Integration tests
        run: uv run --package audit-log pytest services/audit_log/tests/integration -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f services/audit_log/Dockerfile -t audit-log:${{ github.sha }} .

  e2e-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-caching: true

      - name: Install dependencies
        run: uv sync --frozen --package audit-log

      - name: Start stack
        run: docker compose -f infra/docker-compose.audit-e2e.yml up -d --build
        env:
          AL_DB_USER: nordvik
          AL_DB_PASSWORD: nordvik
          AL_DB_NAME: audit_log
          AL_DATABASE_URL: postgresql+asyncpg://nordvik:nordvik@audit-log-db:5432/audit_log
          RABBITMQ_URL: amqp://nordvik:nordvik@rabbitmq:5672/

      - name: Wait for Kong
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:8444/status -o /dev/null && break
            echo "Waiting for Kong... ($i)"
            sleep 3
          done

      - name: Run e2e tests
        run: uv run --package audit-log pytest services/audit_log/tests/e2e -v

      - name: Tear down
        if: always()
        run: docker compose -f infra/docker-compose.audit-e2e.yml down -v
