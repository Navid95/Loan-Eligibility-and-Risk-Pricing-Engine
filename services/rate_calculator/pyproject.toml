[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rate-calculator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "mypy>=1.13",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
