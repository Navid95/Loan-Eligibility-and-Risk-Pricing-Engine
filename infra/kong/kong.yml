_format_version: "3.0"
_transform: true

services:
  - name: rate-calculator
    url: http://rate-calculator:8000
    plugins:
      # Inject a UUID correlation ID on every inbound request and echo it in
      # the response. Downstream services receive X-Correlation-Id so
      # calculation results and audit events can be correlated across the
      # system. If the client already supplies the header it is overwritten.
      - name: correlation-id
        config:
          header_name: X-Correlation-Id
          generator: uuid
          echo_downstream: true

    routes:
      # -----------------------------------------------------------------------
      # Broker-facing: rate calculation
      # Authenticated via API key (key-auth). ACL restricts to broker-group.
      # -----------------------------------------------------------------------
      - name: rates-route
        paths:
          - /api/v1/rates
        strip_path: false
        plugins:
          - name: key-auth
            config:
              hide_credentials: true
          - name: acl
            config:
              allow:
                - broker-group
              hide_groups_header: true
          - name: rate-limiting
            config:
              minute: 60
              policy: local
              limit_by: consumer
              hide_client_headers: false

      # -----------------------------------------------------------------------
      # Admin-facing: configuration management
      # Authenticated via HTTP Basic Auth. ACL restricts to admin-group.
      # -----------------------------------------------------------------------
      - name: config-route
        paths:
          - /api/v1/config
        strip_path: false
        plugins:
          - name: basic-auth
            config:
              hide_credentials: true
          - name: acl
            config:
              allow:
                - admin-group
              hide_groups_header: true

  - name: audit-log
    url: http://audit-log:8000
    routes:
      # -----------------------------------------------------------------------
      # Auditor-facing: compliance record queries
      # Authenticated via HTTP Basic Auth. ACL restricts to auditor-group.
      # -----------------------------------------------------------------------
      - name: records-route
        paths:
          - /api/v1/records
        strip_path: false
        plugins:
          - name: basic-auth
            config:
              hide_credentials: true
          - name: acl
            config:
              allow:
                - auditor-group
              hide_groups_header: true

# -----------------------------------------------------------------------
# Consumers
# -----------------------------------------------------------------------

consumers:
  # Partner brokers — authenticate with a static API key passed in the
  # apikey header (or ?apikey= query param, Kong default).
  - username: broker-alice
    keyauth_credentials:
      - key: bkr-alice-a1b2c3d4e5f6
    acls:
      - group: broker-group

  - username: broker-bob
    keyauth_credentials:
      - key: bkr-bob-f6e5d4c3b2a1
    acls:
      - group: broker-group

  # Internal admins — authenticate with HTTP Basic Auth.
  - username: admin-carol
    basicauth_credentials:
      - username: admin-carol
        password: carol-adm-secret
    acls:
      - group: admin-group

  - username: admin-dave
    basicauth_credentials:
      - username: admin-dave
        password: dave-adm-secret
    acls:
      - group: admin-group

  # Compliance auditors — authenticate with HTTP Basic Auth.
  - username: auditor-alice
    basicauth_credentials:
      - username: auditor-alice
        password: alice-aud-secret
    acls:
      - group: auditor-group
