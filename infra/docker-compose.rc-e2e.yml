services:
  rate-calculator:
    build:
      context: ..
      dockerfile: services/rate_calculator/Dockerfile
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: ${RC_DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
    depends_on:
      rate-calculator-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  kong:
    image: kong:3.7
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8444"
    ports:
      - "8000:8000"
      - "8444:8444"
    volumes:
      - ./kong/kong.rc-e2e.yml:/kong/kong.yml:ro
    depends_on:
      rate-calculator:
        condition: service_healthy

  rate-calculator-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${RC_DB_USER}
      POSTGRES_PASSWORD: ${RC_DB_PASSWORD}
      POSTGRES_DB: ${RC_DB_NAME}
    volumes:
      - rate-calculator-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RC_DB_USER} -d ${RC_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "15672:15672"
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rate-calculator-db-data:
  rabbitmq-data:
