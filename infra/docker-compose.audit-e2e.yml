services:
  audit-log:
    build:
      context: ..
      dockerfile: services/audit_log/Dockerfile
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: ${AL_DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      RABBITMQ_QUEUE: "audit.calculations"
    depends_on:
      audit-log-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  kong:
    image: kong:3.7
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8444"
    ports:
      - "8000:8000"
      - "8444:8444"
    volumes:
      - ./kong/kong.audit-e2e.yml:/kong/kong.yml:ro
    depends_on:
      - audit-log

  audit-log-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${AL_DB_USER}
      POSTGRES_PASSWORD: ${AL_DB_PASSWORD}
      POSTGRES_DB: ${AL_DB_NAME}
    volumes:
      - audit-log-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AL_DB_USER} -d ${AL_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  audit-log-db-data:
  rabbitmq-data:
